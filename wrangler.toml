# Cloudflare Pages configuration for the Shoukhin storefront.
#
# This file declares the D1 binding so the dashboard does not have to.
# Secrets are NOT kept here. Set these in the Pages project
# (Settings → Environment variables → Encrypt):
#   ADMIN_PASSWORD_HASH   generated by: npm run hash-password
#   SESSION_SECRET        any long random string

name = "shoukhin"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "shoukhin-db"
database_id = "7da89647-1efc-4648-b3c3-67a9df8e4f55"

# Enable R2 in this Cloudflare account, create shoukhin-media, then uncomment:
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "shoukhin-media"
